lang: en
format:
  html:
    theme: cosmo
    css: style-handout.css
    toc: false
    page-layout: article
    mainfont: "Atkinson Hyperlegible"
    fontsize: 1.1em
    linestretch: 1.6
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        <style>
          .back-links { font-size: 0.95em; margin-bottom: 1.2em; }
          .secret {
            border: 2px solid #A51C30; background: #FDF3F4; color: #4F0A12;
            border-radius: 8px; padding: 0.7em 1em; margin: 0.5em 0 1.2em 0;
          }
          .say { border-left: 4px solid #006677; background: #F0F7F9;
                 padding: 0.5em 1em; margin: 0.6em 0 1em 0; color: #0C3E48; }
          table { margin-bottom: 1.2em; }
          details { border: 1px solid #1E6B3F; border-radius: 8px; padding: 0.5em 1em; margin: 0.4em 0 1.2em 0; background: #F1F9F4; }
          details summary { color: #1E6B3F; font-weight: 700; cursor: pointer; }
          details[open] summary { margin-bottom: 0.5em; }
          blockquote, .blockquote { color: #1E1E1E !important; font-size: 1em; border-left: 4px solid #595959; }
        </style>
