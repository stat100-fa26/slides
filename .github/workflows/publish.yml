name: Render and Deploy Quarto

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # GitHub's automatic per-run token (not a personal token). pak uses it to
      # download hellodata-science/sfemergency25 from GitHub.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 1. Install R (binary packages from Posit Public Package Manager)
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # 2. Install the R packages used in the .qmd files (cached between runs).
      #    With _freeze/ committed, R only runs for documents whose source
      #    changed since they were last rendered locally.
      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            hellodata-science/sfemergency25
            openintro
            patchwork
            BH
            RcppEigen
          cache-version: 1

      # 3. Set up Quarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 4. TinyTeX for PDF output. Cached so it (and the LaTeX packages
      #    installed on demand during rendering) is not downloaded every run.
      #    Bump v1 to v2 to force a fresh install.
      - name: Cache TinyTeX
        id: cache-tinytex
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-v1

      - name: Install TinyTeX
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        run: quarto install tinytex --no-prompt

      - name: Add TinyTeX to PATH
        run: echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"

      # 5. Render Quarto (frozen documents are not re-executed)
      - name: Render Quarto
        run: quarto render

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Wait up to 20 minutes (default is 10) for GitHub to publish the files.
          timeout: 1200000
